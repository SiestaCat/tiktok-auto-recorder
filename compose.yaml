services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tiktok}
      MYSQL_USER: ${MYSQL_USER:-tiktok}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  
  init-data:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - api-data:/app/data
    command: sh -c "chown -R 1000:1000 /app/data"
    restart: "no"

  api:
    image: tiktok-recorder-api:local
    restart: unless-stopped
    environment: &backend-env
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tiktok}
      MYSQL_USER: ${MYSQL_USER:-tiktok}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api,localhost,127.0.0.1}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      DATA_DIR: /app/data
    volumes: &backend-volumes
      - api-data:/app/data
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn core.wsgi:application --bind 0.0.0.0:8000 --log-level debug --workers 2 --timeout 120 --no-control-socket --access-logfile - --error-logfile - --capture-output"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: tiktok-recorder-api:local
    restart: unless-stopped
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      KEEP_ATTEMPT_PROFILES: ${KEEP_ATTEMPT_PROFILES:-0}
    volumes: *backend-volumes
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "manage.py", "recordworker"]
    stop_grace_period: 90s

  web:
    image: tiktok-recorder-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      WEB_API_BASE_URL: ${WEB_API_BASE_URL:-http://api:8000}
      WEB_API_KEY: ${API_KEY:?Set API_KEY in .env}
      WEB_PASSWORD: ${WEB_PASSWORD:?Set WEB_PASSWORD in .env}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?Set WEB_SESSION_SECRET in .env}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-0}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"

volumes:
  mysql_data:
  api-data:
